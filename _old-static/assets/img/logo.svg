<svg width="300" height="110" viewBox="0 0 300 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nira Atr Sahra">
  <defs>
    <linearGradient id="niraPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a0e0"/>
      <stop offset="1" stop-color="#7c56b8"/>
    </linearGradient>
  </defs>

  <!-- wordmark -->
  <text x="2" y="56" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="52" font-weight="600" fill="url(#niraPurple)" letter-spacing="1">Nira</text>

  <!-- sparkles above the bottle -->
  <g fill="url(#niraPurple)">
    <path d="M182 8 l2.4 5.2 5.2 2.4-5.2 2.4-2.4 5.2-2.4-5.2-5.2-2.4 5.2-2.4z"/>
    <path d="M198 16 l1.6 3.4 3.4 1.6-3.4 1.6-1.6 3.4-1.6-3.4-3.4-1.6 3.4-1.6z"/>
  </g>

  <!-- perfume bottle dotting the "i" -->
  <g transform="translate(160,20)">
    <rect x="0" y="14" width="16" height="20" rx="3" fill="none" stroke="url(#niraPurple)" stroke-width="2.4"/>
    <rect x="5" y="6" width="6" height="8" rx="1.5" fill="none" stroke="url(#niraPurple)" stroke-width="2.2"/>
    <rect x="6.5" y="0" width="3" height="6" rx="1.2" fill="url(#niraPurple)"/>
  </g>

  <!-- leaf emblem overlapping the "a" -->
  <g transform="translate(224,54)">
    <circle cx="18" cy="18" r="18" fill="none" stroke="#1f5c3f" stroke-width="2"/>
    <path d="M18 30c-7-1-11-6-11-13 7 0 12 4 13 11 1-7 6-11 13-11 0 7-4 12-11 13-1 0-3 0-4 0z" fill="none" stroke="#1f5c3f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M18 30V13" stroke="#1f5c3f" stroke-width="1.6"/>
  </g>

  <!-- sub wordmark -->
  <text x="2" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#b6acc6" letter-spacing="2">NIRA ATR SAHRA</text>
</svg>
